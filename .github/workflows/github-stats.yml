name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ✅ 拉最新 main（fetch-depth: 0 方便后面 pull/rebase）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ 先保证有 stats 目录
      - name: Ensure stats directory exists
        run: mkdir -p stats

      - name: Generate stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ChengWu-Data
          template: classic
          base: activity, languages

          # 语言统计配置
          plugin_languages: yes
          plugin_languages_ignored: html,css
          plugin_languages_sections: most-used
          plugin_languages_limit: 6

          # 输出文件到本仓库
          filename: |
            stats/top-langs.png
            stats/github-stats.png
            stats/github-streak.png

      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          # 把 stats 目录加入暂存区（即使已经存在也不会报错）
          git add stats || true

          # 如果没有任何改动，就什么都不做，避免 push 报错
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # 有改动才 commit + pull + push
          git commit -m "Update GitHub stats images"

          # 确保和远端 main 同步，避免 non-fast-forward 报错
          git pull --rebase origin main

          git push origin HEAD:main
