name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 拉取最新 main
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 先保证有 stats 目录
      - name: Ensure stats directory exists
        run: mkdir -p stats

      # 生成统计图（只生成，不自动往仓库里写）
      - name: Generate stats with metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ChengWu-Data
          template: classic
          base: activity, languages

          plugin_languages: yes
          plugin_languages_ignored: html,css
          plugin_languages_sections: most-used
          plugin_languages_limit: 6

          # 生成 SVG 文件，保存在容器里的 /metrics_renders 目录
          config_output: svg
          config_base64: false
          output_action: none
          filename: |
            stats/top-langs.svg
            stats/github-stats.svg
            stats/github-streak.svg

      # 手动把 /metrics_renders 里的文件拷贝到仓库根目录的 stats/ 下
      - name: Copy generated files into repo
        run: |
          ls -R
          mkdir -p stats
          cp -f metrics_renders/stats/*.svg stats/ || true
          ls -R stats

      # 提交并推送
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add stats || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update GitHub stats images"

          git pull --rebase origin main
          git push origin HEAD:main
